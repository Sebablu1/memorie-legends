<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memorie Legends - Lobby</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🃏 Memorie Legends</h1>

      <!-- Info Usuario -->
      <div id="userInfo" class="user-info">
        <span>👤 <span id="username"></span></span>
        <span>💰 Créditos: <span id="creditsDisplay">0</span></span>
        <span>🏆 <span id="winsDisplay">0</span> victorias</span>
      </div>

      <!-- Acciones -->
      <div
        class="actions"
        style="
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          justify-content: center;
        "
      >
        <button id="shopBtn" class="btn-warning">🛒 Tienda</button>
        <button id="rouletteBtn" class="btn-secondary">🎰 Ruleta Gratis</button>
      </div>

      <hr />

      <!-- Crear Sala con Configuración -->
      <div class="lobby-section">
        <h3>🎮 Crear Sala</h3>

        <div
          style="
            background: rgba(15, 52, 96, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
          "
        >
          <div class="form-group" style="margin-bottom: 10px">
            <label style="color: #aaa">🏷️ Nombre de la sala (opcional)</label>
            <input
              type="text"
              id="roomName"
              placeholder="Ej: Torneo Legends"
              style="width: 100%"
            />
          </div>

          <div style="display: flex; gap: 15px; flex-wrap: wrap">
            <div class="form-group" style="flex: 1">
              <label style="color: #aaa">👥 Jugadores</label>
              <select
                id="maxPlayers"
                style="
                  width: 100%;
                  padding: 10px;
                  border-radius: 8px;
                  background: rgba(15, 52, 96, 0.6);
                  color: #fff;
                  border: 2px solid rgba(255, 255, 255, 0.1);
                "
              >
                <option value="2">2 Jugadores</option>
                <option value="3">3 Jugadores</option>
                <option value="4" selected>4 Jugadores</option>
                <option value="5">5 Jugadores</option>
                <option value="6">6 Jugadores</option>
              </select>
            </div>

            <div class="form-group" style="flex: 1">
              <label style="color: #aaa">💰 Apuesta</label>
              <select
                id="betAmount"
                style="
                  width: 100%;
                  padding: 10px;
                  border-radius: 8px;
                  background: rgba(15, 52, 96, 0.6);
                  color: #fff;
                  border: 2px solid rgba(255, 255, 255, 0.1);
                "
              >
                <option value="1">1 Crédito</option>
                <option value="5">5 Créditos</option>
                <option value="10" selected>10 Créditos</option>
                <option value="15">15 Créditos</option>
                <option value="20">20 Créditos</option>
                <option value="50">50 Créditos</option>
                <option value="100">100+ Créditos</option>
              </select>
            </div>
          </div>

          <button
            id="createBtn"
            class="btn-success"
            style="width: 100%; margin-top: 10px"
          >
            ✨ Crear Sala (Gratis)
          </button>
        </div>

        <!-- Unirse a Sala -->
        <h3>🔗 Unirse a Sala</h3>
        <div class="join-section">
          <input
            type="text"
            id="roomCode"
            placeholder="Código de sala"
            style="text-transform: uppercase; flex: 1"
          />
          <button id="joinBtn" class="btn-primary">Unirse</button>
        </div>

        <div id="mensaje" class="mensaje"></div>
      </div>

      <hr />

      <!-- Salas Activas -->
      <div id="salasLista" class="salas-lista">
        <h4>📋 Salas Activas</h4>
        <div id="salasContainer"></div>
      </div>

      <hr />

      <button id="logoutBtn" class="btn-danger">Cerrar Sesión</button>
    </div>

    <!-- Modal Tienda -->
    <div
      id="shopModal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      "
    >
      <div
        style="
          background: #1a1a2e;
          padding: 30px;
          border-radius: 16px;
          max-width: 500px;
          width: 90%;
        "
      >
        <h2 style="text-align: center">🛒 Tienda de Créditos</h2>
        <div
          id="shopItems"
          style="
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
          "
        >
          <button
            class="shop-item"
            data-credits="100"
            data-price="10"
            style="
              padding: 15px;
              background: rgba(33, 150, 243, 0.2);
              border: 2px solid #2196f3;
              border-radius: 10px;
              color: #fff;
              cursor: pointer;
            "
          >
            💰 100 Créditos - 10 Reales
          </button>
          <button
            class="shop-item"
            data-credits="300"
            data-price="25"
            style="
              padding: 15px;
              background: rgba(76, 175, 80, 0.2);
              border: 2px solid #4caf50;
              border-radius: 10px;
              color: #fff;
              cursor: pointer;
            "
          >
            💰 300 Créditos - 25 Reales
          </button>
          <button
            class="shop-item"
            data-credits="600"
            data-price="45"
            style="
              padding: 15px;
              background: rgba(255, 152, 0, 0.2);
              border: 2px solid #ff9800;
              border-radius: 10px;
              color: #fff;
              cursor: pointer;
            "
          >
            💰 600 Créditos - 45 Reales
          </button>
          <button
            class="shop-item"
            data-credits="1200"
            data-price="80"
            style="
              padding: 15px;
              background: rgba(233, 69, 96, 0.2);
              border: 2px solid #e94560;
              border-radius: 10px;
              color: #fff;
              cursor: pointer;
            "
          >
            💰 1200 Créditos - 80 Reales
          </button>
          <button
            class="shop-item"
            data-credits="3000"
            data-price="180"
            style="
              padding: 15px;
              background: rgba(156, 39, 176, 0.2);
              border: 2px solid #9c27b0;
              border-radius: 10px;
              color: #fff;
              cursor: pointer;
            "
          >
            💰 3000 Créditos - 180 Reales
          </button>
        </div>
        <button
          id="closeShopBtn"
          style="
            width: 100%;
            padding: 12px;
            background: #6c757d;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
          "
        >
          Cerrar
        </button>
      </div>
    </div>

    <script type="module" src="js/lobby.js"></script>
  </body>
</html>
