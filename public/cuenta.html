<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <title>Tu cuenta - Memorie Legends</title>
    <meta name="robots" content="noindex, follow" />

    <!-- Esta página se mudó a la pestaña «Cuenta» de `perfil.html` (A2b).

         ─────────────────────────────────────────────────────────────────
         POR QUÉ QUEDA UN ARCHIVO Y NO SE BORRA
         ─────────────────────────────────────────────────────────────────

         Porque su dirección anduvo meses: está en la barra de alguien, en un
         favorito, en el historial, y la nombra `robots.txt`. Borrarla devuelve
         un 404 a gente que hizo lo correcto. Un archivo de veinte líneas es
         más barato que eso.

         ─────────────────────────────────────────────────────────────────
         LAS DOS REDIRECCIONES, Y POR QUÉ LAS DOS
         ─────────────────────────────────────────────────────────────────

         `location.replace` es la que manda: no deja entrada en el historial,
         así que «atrás» vuelve a donde el jugador estaba y no a esta
         pantalla, que lo rebotaría de nuevo hacia adelante.

         El `<meta refresh>` es el respaldo para quien tenga el JavaScript
         apagado.

         Y abajo queda un enlace escrito, porque un `<meta refresh>` de cero
         segundos lo ignoran algunos navegadores por accesibilidad. Sin el
         enlace, ahí no habría forma de seguir. -->
    <script>
      location.replace("/perfil.html#cuenta");
    </script>
    <meta http-equiv="refresh" content="0; url=/perfil.html#cuenta" />

    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #05070b;
        color: #e8e2d4;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      a { color: #d4a843; }
    </style>
  </head>
  <body>
    <p>
      Tu cuenta ahora está en
      <a href="/perfil.html#cuenta">Mi perfil</a>.
    </p>
  </body>
</html>
