<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!--
    La textura de piedra del salón. Un mosaico de 320x320 que el CSS repite.

    Es ruido generado, no una foto: pesa un kilobyte, se repite sin costura
    porque `feTurbulence` con `stitchTiles` cierra los bordes, y no hay ninguna
    licencia que revisar. Va casi transparente a propósito — su trabajo es
    romper el degradado plano del fondo, no verse.
  -->
  <filter id="piedra" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4"
                  seed="7" stitchTiles="stitch" result="ruido" />
    <feColorMatrix in="ruido" type="saturate" values="0" />
  </filter>
  <rect width="320" height="320" filter="url(#piedra)" opacity="0.5" />
</svg>
