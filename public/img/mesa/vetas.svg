<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!--
    Las vetas del paño: ruido estirado, para que la superficie tenga dirección
    y no parezca un plano de color. Se repite igual que `piedra.svg`.
  -->
  <filter id="vetas" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.6" numOctaves="3"
                  seed="19" stitchTiles="stitch" result="ruido" />
    <feColorMatrix in="ruido" type="saturate" values="0" />
  </filter>
  <rect width="600" height="600" filter="url(#vetas)" opacity="0.55" />
</svg>
