<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="none" width="1200" height="800">
  <!--
    Terciopelo carmesí: felpa apretada, oscura en los bordes.

    `preserveAspectRatio="none"` a propósito: esto no es un dibujo, es una
    superficie. Se estira al óvalo de la mesa sin que se note, porque no hay
    ninguna forma reconocible que se pueda deformar.
  -->
  <defs>
    <radialGradient id="luz-carmesi" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#8e2740" />
      <stop offset="44%" stop-color="#5c1428" />
      <stop offset="100%" stop-color="#250712" />
    </radialGradient>
    <filter id="grano-carmesi" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="4" seed="11" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#luz-carmesi)" />
  <rect width="1200" height="800" filter="url(#grano-carmesi)" opacity="0.18" style="mix-blend-mode:overlay" />
</svg>
