<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="none" width="1200" height="800">
  <!--
    Salón de piedra: el paño de siempre, el que se ve sin comprar nada.

    `preserveAspectRatio="none"` a propósito: esto no es un dibujo, es una
    superficie. Se estira al óvalo de la mesa sin que se note, porque no hay
    ninguna forma reconocible que se pueda deformar.
  -->
  <defs>
    <radialGradient id="luz-piedra" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#24304a" />
      <stop offset="44%" stop-color="#161f33" />
      <stop offset="100%" stop-color="#0a1020" />
    </radialGradient>
    <filter id="grano-piedra" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.6" numOctaves="4" seed="11" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#luz-piedra)" />
  <rect width="1200" height="800" filter="url(#grano-piedra)" opacity="0.14" style="mix-blend-mode:overlay" />
</svg>
