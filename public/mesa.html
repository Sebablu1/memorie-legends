<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <title>Memorie Legends — Mesa</title>
    <link rel="icon" href="img/favicon.png" />
    <link rel="stylesheet" href="css/tema.css" />
    <link rel="stylesheet" href="css/mesa.css" />
    <meta name="description" content="La mesa de Memorie Legends: cuatro cartas boca abajo, memoria, reflejos y estrategia con baraja española. Entrenamiento contra la IA o por Leyendas." />
    <!-- La tarjeta que se ve al compartir el enlace.

         La imagen va con URL ABSOLUTA y en JPG a propósito. Una ruta relativa
         no la encuentra ningún lector de enlaces —no navegan la página, sólo
         leen estas etiquetas— y WhatsApp no muestra WebP, que es el formato
         del resto del sitio. Pesa 75 KB: por encima de unos pocos cientos, la
         miniatura deja de aparecer en varios clientes.

         1200x630 es la proporción que piden las tarjetas grandes. Declarar
         `width` y `height` evita que el primer visitante vea el enlace sin
         imagen mientras el servicio la mide por su cuenta. -->
    <link rel="canonical" href="https://memorie-legends.web.app/mesa.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Memorie Legends" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://memorie-legends.web.app/mesa.html" />
    <meta property="og:title" content="Mesa — Memorie Legends" />
    <meta property="og:description" content="La mesa de Memorie Legends: cuatro cartas boca abajo, memoria, reflejos y estrategia con baraja española. Entrenamiento contra la IA o por Leyendas." />
    <meta property="og:image" content="https://memorie-legends.web.app/img/compartir.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Memorie Legends sobre fondo oscuro" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mesa — Memorie Legends" />
    <meta name="twitter:description" content="La mesa de Memorie Legends: cuatro cartas boca abajo, memoria, reflejos y estrategia con baraja española. Entrenamiento contra la IA o por Leyendas." />
    <meta name="twitter:image" content="https://memorie-legends.web.app/img/compartir.jpg" />
  </head>
  <body>
    <!--
      La pantalla de carga del entrenamiento.

      Va escrita en el HTML y visible de entrada —no la crea el JavaScript—
      porque su primer trabajo es tapar el momento ANTERIOR a que el JavaScript
      corra: la mesa comprueba la sesión antes de repartir, y sin esto se veía
      un tablero vacío con "Preparando la partida…" durante ese rato.

      La quita `mesa.js` cuando terminó de repartir. Si el JavaScript nunca
      llega a correr, se va igual: ver la regla con `animation` en mesa.css, que
      la desvanece sola a los diez segundos. Un velo que se queda pegado es peor
      que no tener velo.
    -->
    <div class="velo-carga" id="veloCarga">
      <img
        class="velo-carga-logo"
        src="img/memorie-legends3.png"
        alt="Memorie Legends"
        width="612"
        height="408"
      />
      <span class="velo-carga-aro" aria-hidden="true"></span>
      <p class="velo-carga-texto" role="status">Cargando entrenamiento…</p>
    </div>

    <!-- La cuenta regresiva previa a la mirada. Vacía hasta que hace falta. -->
    <div class="cuenta-atras" id="cuentaAtras" aria-hidden="true" hidden>
      <span class="cuenta-atras-numero" id="cuentaAtrasNumero"></span>
    </div>

    <div class="escena">
      <header class="cabecera">
        <img class="marca" src="img/memorie-legends2.webp" alt="Memorie Legends" />
        <div>
          <h1>Memorie Legends</h1>
          <div class="lema">Mesa de 4 · límite 150</div>
        </div>
        <div class="derecha">
          <div class="chip-ronda">Ronda <strong id="numeroRonda">-</strong></div>
          <button id="btnRegistro" class="btn-icono" type="button"
                  aria-label="Ver el registro de jugadas" aria-expanded="false"
                  aria-controls="panelRegistro"
                  title="Ver el registro de jugadas"><span aria-hidden="true">📜</span></button>
          <button id="btnSonido" class="btn-icono" type="button"
                  aria-label="Silenciar sonidos" aria-pressed="false"
                  title="Silenciar sonidos"><span aria-hidden="true">🔊</span></button>
          <button id="btnAbandonar" class="btn-icono" type="button"
                  aria-label="Abandonar la partida"
                  title="Abandonar la partida"><span aria-hidden="true">🚪</span></button>
        </div>
      </header>

      <div class="mesa-zona">
        <main class="mesa" id="mesa">
          <div class="asiento asiento-arriba" id="asientoArriba"></div>
          <div class="asiento asiento-izq" id="asientoIzq"></div>
          <div class="asiento asiento-der" id="asientoDer"></div>

          <div class="centro">
            <div class="pila" id="pilaMazo">
              <div class="etiqueta">Mazo</div>
              <div id="mazoCarta"></div>
              <div class="contador" id="mazoContador"></div>
            </div>

            <div class="pila levantada-caja" id="pilaLevantada">
              <div class="etiqueta">Levantada</div>
              <div id="levantadaCarta"></div>
              <div class="contador" id="levantadaNota"></div>
            </div>

            <div class="pila">
              <div class="etiqueta">Muestra</div>
              <div id="muestraCarta"></div>
              <div class="contador" id="descarteContador"></div>
            </div>
          </div>

          <!-- Tu mano es un asiento más del paño: si vive fuera del óvalo
               empuja hacia abajo todo lo que viene después. -->
          <div class="asiento asiento-abajo" id="asientoAbajo"></div>
        </main>
      </div>

      <div class="acciones">
        <!-- La pista dice qué se puede hacer en cada momento. Es el canal
             principal del juego para quien no ve la mesa, así que se anuncia
             sola. `polite` y no `assertive`: no debe cortar lo que el lector
             esté leyendo. -->
        <div class="pista" id="pista" role="status" aria-live="polite">Preparando la partida…</div>

        <!-- La cuenta atrás de la mirada y de los reflejos vive acá, junto a la
             instrucción que la explica. Sobre el paño tapaba la ficha del
             jugador de enfrente justo cuando hay que mirar la mesa. -->
        <!-- El texto del temporizador se repinta cada 80 ms. Anunciarlo sería
             un lector hablando sin parar, así que queda oculto para la
             accesibilidad: el cambio de fase ya lo cuenta la pista. -->
        <div class="temporizador" id="temporizador" aria-hidden="true">
          <span class="texto" id="temporizadorTexto"></span>
          <span class="barra"><i class="relleno" id="temporizadorRelleno"></i></span>
        </div>

        <div class="reloj-turno" id="relojTurno" aria-hidden="true" hidden>
          <span class="reloj-numero" id="relojNumero">8</span>
          <span class="reloj-barra"><i class="reloj-relleno" id="relojRelleno"></i></span>
        </div>
        <button id="btnLevantar" class="accion" disabled>Levantar</button>
        <button id="btnTirar" class="accion sobria" disabled>Tirar</button>
        <button id="btnCortar" class="accion peligro" disabled>Cortar</button>
        <button id="btnPasar" class="accion sobria" disabled>Pasar</button>
      </div>

      <aside class="lateral">
        <section class="tarjeta">
          <h2>Ronda</h2>
          <div id="marcador"></div>
        </section>
      </aside>
    </div>

    <!-- El registro sigue completo, pero fuera del paño: cerrado no ocupa
         nada, y abierto se desliza por encima con su propio scroll. -->
    <div class="panel-registro" id="panelRegistro" role="region"
         aria-label="Registro de jugadas" hidden>
      <div class="panel-cabecera">
        <h2>Registro de jugadas</h2>
        <button id="btnCerrarRegistro" class="btn-icono" type="button"
                aria-label="Cerrar el registro"
                title="Cerrar el registro"><span aria-hidden="true">✕</span></button>
      </div>
      <div class="registro" id="registro" role="log" aria-label="Jugadas de la partida"></div>
    </div>

    <canvas id="confeti" aria-hidden="true"></canvas>

    <div class="velo" id="velo">
      <div class="modal" id="modal" role="dialog" aria-modal="true"
           aria-label="Decisión de la partida"></div>
    </div>

    <script type="module" src="js/mesa.js"></script>
  </body>
</html>
