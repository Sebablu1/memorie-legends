<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <title>Memorie Legends — Mesa</title>
    <link rel="icon" href="img/claude-inspiration/logo.png" />
    <link rel="stylesheet" href="css/tema.css" />
    <link rel="stylesheet" href="css/mesa.css" />
      <link rel="stylesheet" href="css/pie.css" />
</head>
  <body>
    <div class="escena">
      <header class="cabecera">
        <img class="marca" src="img/claude-inspiration/logo.png" alt="Memorie Legends" />
        <div>
          <h1>Memorie Legends</h1>
          <div class="lema">Mesa de 4 · límite 150</div>
        </div>
        <div class="derecha">
          <div class="chip-ronda">Ronda <strong id="numeroRonda">-</strong></div>
          <button id="btnSonido" class="btn-icono" type="button" title="Silenciar sonidos">🔊</button>
          <button id="btnAbandonar" class="btn-icono" type="button" title="Abandonar la partida">🚪</button>
        </div>
      </header>

      <div class="mesa-zona">
        <main class="mesa" id="mesa">
          <div class="temporizador" id="temporizador">
            <span class="texto" id="temporizadorTexto"></span>
            <span class="barra"><i class="relleno" id="temporizadorRelleno"></i></span>
          </div>

          <div class="asiento asiento-arriba" id="asientoArriba"></div>
          <div class="asiento asiento-izq" id="asientoIzq"></div>
          <div class="asiento asiento-der" id="asientoDer"></div>

          <div class="centro">
            <div class="pila" id="pilaMazo">
              <div class="etiqueta">Mazo</div>
              <div id="mazoCarta"></div>
              <div class="contador" id="mazoContador"></div>
            </div>

            <div class="pila levantada-caja" id="pilaLevantada">
              <div class="etiqueta">Levantada</div>
              <div id="levantadaCarta"></div>
              <div class="contador" id="levantadaNota"></div>
            </div>

            <div class="pila">
              <div class="etiqueta">Muestra</div>
              <div id="muestraCarta"></div>
              <div class="contador" id="descarteContador"></div>
            </div>
          </div>

        </main>

        <div class="asiento asiento-abajo" id="asientoAbajo"></div>
      </div>

      <div class="acciones">
        <div class="pista" id="pista">Preparando la partida…</div>

        <div class="reloj-turno" id="relojTurno" hidden>
          <span class="reloj-numero" id="relojNumero">8</span>
          <span class="reloj-barra"><i class="reloj-relleno" id="relojRelleno"></i></span>
        </div>
        <button id="btnLevantar" class="accion" disabled>Levantar</button>
        <button id="btnTirar" class="accion sobria" disabled>Tirar</button>
        <button id="btnCortar" class="accion peligro" disabled>Cortar</button>
        <button id="btnPasar" class="accion sobria" disabled>Pasar</button>
      </div>

      <aside class="lateral">
        <section class="tarjeta">
          <h2>Marcador</h2>
          <div id="marcador"></div>
        </section>
        <section class="tarjeta">
          <h2>Registro</h2>
          <div class="registro" id="registro"></div>
        </section>
      </aside>
    </div>

    <canvas id="confeti"></canvas>

    <div class="velo" id="velo">
      <div class="modal" id="modal"></div>
    </div>

    <script type="module" src="js/mesa.js"></script>
  
    <footer>
      <div class="footer-content">
        <div class="footer-links">
          <a href="/como-se-juega.html">📜 Cómo se Juega</a>
          <a href="/quienes-somos.html">Quiénes Somos</a>
          <a href="/terminos.html">Términos y Condiciones</a>
          <a href="/privacidad.html">Políticas de Privacidad</a>
          <a href="/seguridad.html">Seguridad</a>
        </div>
        <p>&copy; 2026 Memorie Legends. Todos los derechos reservados.</p>
      </div>
    </footer>
  </body>
</html>
