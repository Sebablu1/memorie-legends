<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memorie Legends - Registro</title>
    <link rel="icon" href="img/favicon.png" />

    <!-- El logo empieza a bajar YA: es lo más grande de la pantalla, y sin
         esto el navegador no se entera de que existe hasta terminar el CSS. -->
    <link rel="preload" as="image" href="img/memorie-legends3.webp" fetchpriority="high" />
    <link rel="stylesheet" href="css/tema.css" />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .support-footer {
        text-align: center;
        margin-top: 25px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: #a0a0a0;
        font-size: 0.8rem;
      }
      .support-footer a {
        color: #d4a843;
        text-decoration: none;
        font-weight: 600;
      }
      .support-footer a:hover {
        text-decoration: underline;
      }
    </style>
      <link rel="stylesheet" href="css/pie.css" />
    <meta name="description" content="Creá tu cuenta gratis y llevate Leyendas de regalo para empezar a jugar." />
    <!-- La tarjeta que se ve al compartir el enlace.

         La imagen va con URL ABSOLUTA y en JPG a propósito. Una ruta relativa
         no la encuentra ningún lector de enlaces —no navegan la página, sólo
         leen estas etiquetas— y WhatsApp no muestra WebP, que es el formato
         del resto del sitio. Pesa 75 KB: por encima de unos pocos cientos, la
         miniatura deja de aparecer en varios clientes.

         1200x630 es la proporción que piden las tarjetas grandes. Declarar
         `width` y `height` evita que el primer visitante vea el enlace sin
         imagen mientras el servicio la mide por su cuenta. -->
    <link rel="canonical" href="https://memorie-legends.web.app/register.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Memorie Legends" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://memorie-legends.web.app/register.html" />
    <meta property="og:title" content="Crear cuenta — Memorie Legends" />
    <meta property="og:description" content="Creá tu cuenta gratis y llevate Leyendas de regalo para empezar a jugar." />
    <meta property="og:image" content="https://memorie-legends.web.app/img/compartir.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo de Memorie Legends sobre fondo oscuro" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crear cuenta — Memorie Legends" />
    <meta name="twitter:description" content="Creá tu cuenta gratis y llevate Leyendas de regalo para empezar a jugar." />
    <meta name="twitter:image" content="https://memorie-legends.web.app/img/compartir.jpg" />
  </head>
  <body class="acceso">
    <div class="container">
      <!-- El mismo logo que la caja de iniciar sesión.

           Antes era el cuadrado con marco, más el nombre escrito al lado. Dos
           pantallas hermanas con dos logos distintos se ven como dos sitios, y
           éstas son las dos puertas del mismo.

           Va dentro de un <h1> aunque no tenga texto a la vista: sin él, la
           página se quedaba con un <h2> y ningún encabezado por encima, o sea
           sin nombre para un buscador y para un lector de pantalla. El nombre
           lo lleva el `alt`, que es texto de verdad. Es el mismo recurso que
           usa la portada.

           `width`/`height` son los del archivo: le reservan el espacio al
           navegador para que el formulario no salte cuando la imagen baja. -->
      <h1 class="marca-login">
        <img
          class="logo-login"
          src="img/memorie-legends3.webp"
          alt="Memorie Legends"
          width="420"
          height="280"
          fetchpriority="high"
        />
      </h1>
      <h2>Crear Cuenta</h2>

      <div id="mensaje" class="mensaje"></div>

      <!-- Con Google primero, igual que en el login.

           Va arriba y no abajo porque es el camino más corto: no hay que
           elegir contraseña ni verificar el correo después. Quien prefiera
           correo tiene el formulario justo debajo. -->
      <button id="googleBtn" type="button" class="google-btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 48 48"
        >
          <path
            fill="#FFC107"
            d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"
          />
          <path
            fill="#FF3D00"
            d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"
          />
          <path
            fill="#4CAF50"
            d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"
          />
          <path
            fill="#1976D2"
            d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"
          />
        </svg>
        Crear cuenta con Google
      </button>

      <div class="or-divider">o</div>

      <form id="registerForm">
        <div class="form-group">
          <input
            type="text"
            id="username"
            placeholder="Nombre de usuario"
            required
          />
        </div>
        <div class="form-group">
          <input type="email" id="email" placeholder="Email" required />
        </div>
        <div class="form-group">
          <input
            type="password"
            id="password"
            placeholder="Contraseña (mínimo 6 caracteres)"
            required
          />
        </div>
        <button type="submit" class="btn-primary">Registrarse</button>
      </form>

      <p class="link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
      </p>

      <!-- Footer con correo de soporte -->
      <div class="support-footer">
        <p>
          ¿Necesitas ayuda?
          <a href="mailto:soporte.memorie.legends@gmail.com">
            soporte.memorie.legends@gmail.com
          </a>
        </p>
        <p style="color: #555; font-size: 0.7rem; margin-top: 5px">
          Memorie Legends - Tu juego de memoria favorito
        </p>
      </div>
    </div>

    <script type="module" src="js/register.js"></script>
  
    <footer>
      <div class="footer-content">
        <div class="footer-links">
          <a href="/como-se-juega.html">📜 Cómo se Juega</a>

          <a href="/seguridad.html">Seguridad</a>
        </div>
        <p>&copy; 2026 Memorie Legends. Todos los derechos reservados.</p>
      </div>
    </footer>
  </body>
</html>
