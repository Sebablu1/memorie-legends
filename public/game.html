<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memorie Legends - Partida</title>
    <link rel="stylesheet" href="css/tema.css" />
    <link rel="stylesheet" href="css/style.css" />
      <link rel="stylesheet" href="css/pie.css" />
</head>
  <body>
    <div class="container">
      <h1 class="marca-titulo"><a href="dashboard.html"><img src="img/claude-inspiration/logo.png" alt="Memorie Legends" class="logo-img"><span class="logo-text">Memorie Legends</span></a></h1>

      <div id="salaInfo" class="sala-info">
        Sala: <span id="roomCode"></span>
      </div>

      <div id="estadoJuego" class="estado-juego">
        <div id="fase">Esperando jugadores...</div>
        <div id="turno">Turno de: <span id="turnoJugador">-</span></div>
      </div>

      <div id="mesa" class="mesa">
        <div id="cartaMuestra" class="carta-muestra">
          🃏 Muestra: <span id="muestra">-</span>
        </div>
        <div id="jugadores" class="jugadores-container"></div>
      </div>

      <div id="manoJugador" class="mano-jugador">
        <h3>📋 Tus cartas</h3>
        <div id="cartas" class="cartas-container"></div>
      </div>

      <div id="acciones" class="acciones">
        <button id="levantarBtn" class="btn-primary" disabled>
          Levantar carta
        </button>
        <button id="iniciarBtn" class="btn-success" style="display: none">
          Iniciar partida
        </button>
        <button id="corteBtn" class="btn-warning" disabled>
          Declarar Corte
        </button>
      </div>

      <div id="mensaje" class="mensaje"></div>

      <button id="salirBtn" class="btn-danger">Salir de la sala</button>
    </div>

    <script type="module" src="js/game.js"></script>
  
    <footer>
      <div class="footer-content">
        <div class="footer-links">
          <a href="/como-se-juega.html">📜 Cómo se Juega</a>
          <a href="/quienes-somos.html">Quiénes Somos</a>
          <a href="/terminos.html">Términos y Condiciones</a>
          <a href="/privacidad.html">Políticas de Privacidad</a>
          <a href="/seguridad.html">Seguridad</a>
        </div>
        <p>&copy; 2026 Memorie Legends. Todos los derechos reservados.</p>
      </div>
    </footer>
  </body>
</html>
